name: XNOR Resolved Authority Binding Adapter Review

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_resolved_authority_binding_adapter.py'
      - 'tests/test_xnor_resolved_authority_binding_adapter.py'
      - '.github/workflows/xnor-resolved-authority-binding-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test synthetic authority and commit binding
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_resolved_authority_binding_adapter.py' -v
