name: XNOR Synthetic Gate Demonstration

on:
  pull_request:
    paths:
      - 'tests/test_xnor_synthetic_gate_demonstration.py'
      - '.github/workflows/xnor-synthetic-gate-demonstration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic gate demonstration
        run: python -m unittest discover -s tests -p 'test_xnor_synthetic_gate_demonstration.py' -v
