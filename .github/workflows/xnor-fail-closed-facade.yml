name: XNOR Fail Closed Facade Review

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_fail_closed_facade.py'
      - 'tests/test_xnor_fail_closed_facade.py'
      - '.github/workflows/xnor-fail-closed-facade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fail-closed isolated facade
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_fail_closed_facade.py' -v
