name: XNOR Signed Lineage Composition Review

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_signed_lineage_composition.py'
      - 'tests/test_xnor_signed_lineage_composition.py'
      - '.github/workflows/xnor-signed-lineage-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test-only crypto dependency
        run: python -m pip install 'cryptography==44.0.2'
      - name: Test signed lineage composition without authority
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_signed_lineage_composition.py' -v
