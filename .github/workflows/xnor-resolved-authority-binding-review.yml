name: XNOR Resolved Authority Binding Review

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_resolved_authority_boundary.py'
      - 'tests/test_xnor_resolved_authority_boundary.py'
      - '.github/workflows/xnor-resolved-authority-binding-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic resolved-authority binding tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_resolved_authority_boundary.py' -v
