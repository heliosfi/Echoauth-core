name: SAL-12 Authorization Currentness

on:
  pull_request:
    paths:
      - "src/echoauth/auth/authorization_gate.py"
      - "src/echoauth/auth/authorization_models.py"
      - "src/echoauth/auth/authority_resolution.py"
      - "src/echoauth/auth/delegation_service.py"
      - "src/echoauth/identity/service.py"
      - "src/echoauth/policy/service.py"
      - "tests/test_authorization_gate.py"
      - "tests/test_sal12_authorization_currentness.py"
      - ".github/workflows/sal-12-authorization-currentness.yml"

permissions:
  contents: read

jobs:
  sal-12-authorization-currentness:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SAL-12 authorization currentness tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_sal12_authorization_currentness
