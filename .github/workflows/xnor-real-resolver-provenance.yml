name: XNOR Real Resolver Provenance Review

on:
  pull_request:
    paths:
      - 'tests/test_xnor_real_resolver_provenance.py'
      - '.github/workflows/xnor-real-resolver-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe real gate resolver provenance
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_real_resolver_provenance.py' -v
