name: EchoAuth demo verification (no deployment)
on:
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/echoauth-demo-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded demo tests
        run: python -m unittest discover -s demo -p 'test_*.py' -v
      - name: Compile demo
        run: python -m py_compile demo/echoauth_demo.py
