name: XNOR Ed25519 Test Vectors

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_ed25519_test_vector_verifier.py'
      - 'tests/test_xnor_ed25519_test_vectors.py'
      - '.github/workflows/xnor-ed25519-test-vectors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only crypto dependency
        run: python -m pip install 'cryptography==44.0.2'
      - name: Verify isolated test-only signatures and negative vectors
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_ed25519_test_vectors.py' -v
