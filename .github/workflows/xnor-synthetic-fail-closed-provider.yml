name: XNOR Synthetic Fail-Closed Provider Review

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_synthetic_fail_closed_provider.py'
      - 'tests/test_xnor_synthetic_fail_closed_provider.py'
      - '.github/workflows/xnor-synthetic-fail-closed-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic fail-closed provider tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_synthetic_fail_closed_provider.py' -v
