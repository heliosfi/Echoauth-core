name: XNOR Synthetic Boundary Review Tests

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_revocation_synthetic_boundary.py'
      - 'tests/test_xnor_synthetic_boundary.py'
      - '.github/workflows/xnor-synthetic-boundary-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated synthetic-only boundary tests
        run: python -m unittest discover -s tests -p 'test_xnor_synthetic_boundary.py' -v
