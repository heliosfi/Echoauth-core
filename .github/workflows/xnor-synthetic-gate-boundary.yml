name: XNOR Synthetic Gate Boundary Review

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_synthetic_gate_boundary.py'
      - 'tests/test_xnor_synthetic_gate_boundary.py'
      - '.github/workflows/xnor-synthetic-gate-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic boundary tests
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_synthetic_gate_boundary.py' -v
