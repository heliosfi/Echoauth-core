name: XNOR Real Resolver Evidence Observer

on:
  pull_request:
    paths:
      - 'review_candidates/xnor_resolver_evidence_observer.py'
      - 'tests/test_xnor_resolver_evidence_observer.py'
      - '.github/workflows/xnor-resolver-evidence-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe real resolver evidence without altering decisions
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_resolver_evidence_observer.py' -v
