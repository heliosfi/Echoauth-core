name: XNOR External Coverage Gate Review

on:
  pull_request:
    paths:
      - 'tests/test_xnor_external_coverage_gate_review.py'
      - '.github/workflows/xnor-external-coverage-gate-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test real gate with synthetic coverage injection
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_xnor_external_coverage_gate_review.py' -v
